# Example evaluation config for `python evaluator.py run --config example-config.toml`
#
# Runs every (team x dataset x scenario) combination and stores the
# results in the SQLite database given by `db`.

# Scenarios to run for every team. Each team's image must define these in its
# scenarios.yaml; any it does not define is recorded as a failed run.
scenarios = [
    "high_recall",
    # "fast",
    # "memory"
]

# Datasets to evaluate against (paths to the HDF5 files under datasets/).
datasets = [
    # "datasets/fashion-mnist-784-euclidean.hdf5",
    "datasets/agnews-mxbai-public.hdf5",
    "datasets/celeba-resnet-public.hdf5",
    "datasets/gooaq-distilroberta-public.hdf5",
    "datasets/imagenet-clip-public.hdf5",
    "datasets/landmark-nomic-public.hdf5",
    "datasets/simplewiki-openai-public.hdf5",
    "datasets/yahoo-minilm-public.hdf5"
]

# Optional overrides (defaults shown).
db      = "results-aws.db"
timeout = 1800
k       = 100
gpu     = true

# Where to run the containers. Omit this block (or backend = "local") to use the
# local Docker daemon, exactly as before. With backend = "aws" the evaluator
# provisions ONE EC2 instance of the chosen type, runs every container on it,
# and terminates it when done. Datasets are downloaded onto the host over HTTP
# from `datasets_base_url`; locally-built images are shipped with docker save/load.
# Override per-invocation with `--backend aws` / `--backend local`.
#
[runner]
backend       = "aws"            # "local" (default) | "aws"
instance_type = "g7.2xlarge"
region        = "us-east-2"
ami           = "ami-0eeae0743b9ce764c"   # Ubuntu AMI; user-data installs docker if missing
key_name      = "orthogonal-us-east-2"     # existing EC2 key pair name
key_path      = "~/.ssh/orthogonal-us-east-2.pem"   # local private key for SSH
security_group_ids = ["sg-0061338ead1486346"] # must allow inbound SSH from where the evaluator runs
volume_size_gb = 100             # root EBS size (datasets can be large)
terminate_after = true           # set false to keep the instance for debugging
datasets_base_url = "https://www.dei.unipd.it/~ceccarello/orthogonal-datasets"

# Teams — one table per submission in the competitors/ directory.
[[teams]]
name  = "neighbors-grass"
image = "neighbors-grass/ann:latest"

[[teams]]
name  = "friendly-neighborhood-solvers"
image = "ortho-prelim-1:sherlock"

[[teams]]
name  = "faiss-hnsw-baseline"
image = "ann-orthogonal/faiss"

[[teams]]
name  = "annarchy"
image = "annarchy/nns:latest"

[[teams]]
name  = "close-enough"
image = "close-enough:latest"

[[teams]]
name  = "annvedi"
image = "annvedi/nns:latest"

[[teams]]
name  = "kinda-neighbors"
image = "visonfranc/kinda-neighbors:latest"

[[teams]]
name  = "finding-nnemo"
image = "finding-nnemo/nns:latest"
