# NNS Competition – Scenario Definitions (faiss-hnsw baseline)
# =========================================
# Structure:
#
#   scenarios:
#     <scenario_name>:
#       default:                    # fallback for any unlisted dataset
#         index_params: {...}
#         query_params: {...}
#       <dataset_name>:             # dataset-specific override (optional)
#         index_params: {...}
#         query_params: {...}
#
# Dataset names match the HDF5 filename stem (e.g. "agnews-mxbai-private" for
# agnews-mxbai-private.hdf5). The evaluated datasets are the *-private files.
#
# The ef values below were tuned by sweeping efSearch on the public query sets
# (see hnsw_sweep.py) and picking, per dataset, the smallest ef that clears the
# recall target with a safety margin. Recall is distance-based @k=100, exactly
# as evaluator.py computes it.
#
#   high_recall / memory : target avg recall >= 0.95
#   fast                 : target avg recall >= 0.80
#
# high_recall uses a denser graph (M=32, efC=200): it reaches 0.95 at a lower ef,
# giving faster queries and fewer distance computations. memory uses the leaner
# baseline graph (M=16, efC=100) to minimise index memory while still >= 0.95.

scenarios:

  # ---- >= 0.95 recall, optimised for speed / fewest distances ----
  high_recall:
    default:
      index_params: {efConstruction: 200, M: 32}
      query_params: {ef: 160}
    agnews-mxbai-private:
      index_params: {efConstruction: 200, M: 32}
      query_params: {ef: 120}
    celeba-resnet-private:
      index_params: {efConstruction: 200, M: 32}
      query_params: {ef: 160}
    gooaq-distilroberta-private:
      index_params: {efConstruction: 200, M: 32}
      query_params: {ef: 120}
    imagenet-clip-private:
      index_params: {efConstruction: 200, M: 32}
      query_params: {ef: 120}
    landmark-nomic-private:
      index_params: {efConstruction: 200, M: 32}
      query_params: {ef: 100}
    simplewiki-openai-private:
      index_params: {efConstruction: 200, M: 32}
      query_params: {ef: 120}
    yahoo-minilm-private:
      index_params: {efConstruction: 200, M: 32}
      query_params: {ef: 160}

  # ---- >= 0.80 recall, minimal work ----
  fast:
    default:
      index_params: {efConstruction: 100, M: 16}
      query_params: {ef: 50}

  # ---- >= 0.95 recall, optimised for low memory (leaner M=16 graph) ----
  memory:
    default:
      index_params: {efConstruction: 100, M: 16}
      query_params: {ef: 260}
    agnews-mxbai-private:
      index_params: {efConstruction: 100, M: 16}
      query_params: {ef: 160}
    celeba-resnet-private:
      index_params: {efConstruction: 100, M: 16}
      query_params: {ef: 260}
    gooaq-distilroberta-private:
      index_params: {efConstruction: 100, M: 16}
      query_params: {ef: 160}
    imagenet-clip-private:
      index_params: {efConstruction: 100, M: 16}
      query_params: {ef: 160}
    landmark-nomic-private:
      index_params: {efConstruction: 100, M: 16}
      query_params: {ef: 120}
    simplewiki-openai-private:
      index_params: {efConstruction: 100, M: 16}
      query_params: {ef: 160}
    yahoo-minilm-private:
      index_params: {efConstruction: 100, M: 16}
      query_params: {ef: 200}
